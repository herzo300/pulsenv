name: soobshio
description: "Пульс города Нижневартовск — Flutter client"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.1.1

  # UI
  cupertino_icons: ^1.0.8
  lottie: ^3.3.3
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.2

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # HTTP + State
  http: ^1.2.2
  provider: ^6.1.2

  # Local DB
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.5

  # Telegram
  url_launcher: ^6.3.0

  # WebSocket (для реал-тайм обновлений)
  web_socket_channel: ^3.0.1

  # JSON
  json_annotation: ^4.11.0
  sensors_plus: ^7.0.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_svg: ^2.2.3
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  webview_flutter: ^4.13.1
  video_player: ^2.11.0
  chewie: ^1.13.0
  geolocator: ^14.0.2
  awesome_notifications: ^0.11.0
  google_fonts: ^8.0.2
  fl_chart: ^1.1.1
  workmanager: ^0.9.0+3
  image: ^4.8.0
  google_generative_ai: ^0.4.7
  sentry_flutter: ^9.14.0
  cached_network_image: ^3.4.1
  google_mlkit_text_recognition: ^0.15.1
  connectivity_plus: ^7.0.0
  pmtiles: ^1.2.0
  flutter_map_pmtiles: ^1.0.5
  file_picker: ^10.3.10
  go_router: ^16.2.0
  page_transition: ^2.2.1
  share_plus: ^12.0.0
  confetti: ^0.8.0
  package_info_plus: ^9.0.1
  flutter_glow: ^0.3.0
  vibration: ^2.1.0
  flutter_inappwebview: ^6.1.5
  camera: ^0.11.1
  in_app_review: ^2.0.9
  flutter_map_tile_caching: ^10.1.0
  weather_animation: ^1.0.1
  flutter_chat_ui: ^1.6.8
  flutter_background_service: ^5.1.0
  flutter_3d_controller: ^2.0.0
  media_kit: ^1.1.1
  media_kit_video: ^1.1.1
  nearby_connections: ^4.3.0
  local_auth: ^2.2.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/animations/
    - assets/markers/
    - assets/3d_icons/
    - assets/weather_3d/
    - assets/infographic_data.json
    - assets/icon.png
    - assets/cameras_nv.json
    - assets/audio/
    - assets/sounds/

  shaders:
    - shaders/fog_theme.frag
    - shaders/rain_ambient.frag
    - shaders/aura_theme.frag
    - shaders/water_theme.frag
    - shaders/cosmos_theme.frag
    - shaders/hologram.frag
    - shaders/weather_overlay.frag

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
