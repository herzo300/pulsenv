name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check services backend core tests --ignore E501,T201

  test:
    runs-on: ubuntu-latest
    needs: [secret-scan, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run all tests
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          DB_AUTO_CREATE: "true"
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
          ADMIN_API_TOKEN: ci-test-admin-token
          REPORT_RETENTION_CLEANUP_ENABLED: "false"
        run: pytest tests/ -q
