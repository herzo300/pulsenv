<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Гермес: ИИ-ассистент — стилизованный кадуцей-частица -->
  <defs>
    <linearGradient id="pg" x1="6" y1="8" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B132B"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#night)" stroke="url(#pg)" stroke-opacity="0.35" stroke-width="1.2"/>
  <!-- орбитальные дуги -->
  <ellipse cx="24" cy="24" rx="15" ry="6" stroke="url(#pg)" stroke-width="1.8" transform="rotate(-24 24 24)"/>
  <ellipse cx="24" cy="24" rx="15" ry="6" stroke="url(#pg)" stroke-width="1.8" stroke-opacity="0.55" transform="rotate(24 24 24)"/>
  <!-- ядро -->
  <circle cx="24" cy="24" r="5.2" fill="url(#pg)"/>
  <circle cx="24" cy="24" r="8.6" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1"/>
  <!-- искры -->
  <circle cx="36.5" cy="14" r="1.6" fill="#00E5FF"/>
  <circle cx="11" cy="34" r="1.3" fill="#7C3AED"/>
  <circle cx="34" cy="36" r="1.1" fill="#00E5FF" fill-opacity="0.6"/>
</svg>
