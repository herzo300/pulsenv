name: soobshio

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: soobshio_postgres
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soobshio}
      POSTGRES_USER: ${POSTGRES_USER:-soobshio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soobshio_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - runtime
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soobshio} -d ${POSTGRES_DB:-soobshio}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: soobshio_redis
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_dev_pass}" ]
    volumes:
      - redis_data:/data
    networks:
      - runtime
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_pass}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soobshio_backend
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - .env
    environment:
      PORT: 8000
      YOLO_MODELS_DIR: /app/models
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://45.153.68.59}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-soobshio}:${POSTGRES_PASSWORD:-soobshio_dev_pass}@postgres:5432/${POSTGRES_DB:-soobshio}
      VISERON_ENABLED: ${VISERON_ENABLED:-true}
      VISERON_WEBHOOK_TOKEN: ${VISERON_WEBHOOK_TOKEN:-}
      TG_AUTO_START_MONITOR: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime_uploads:/app/static/uploads
      - runtime_logs:/app/logs
      - ./public:/app/public:ro
      - ./opendata_full.json:/app/opendata_full.json:ro
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - runtime
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    security_opt:
      - no-new-privileges:true

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soobshio_monitoring
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-soobshio}:${POSTGRES_PASSWORD:-soobshio_dev_pass}@postgres:5432/${POSTGRES_DB:-soobshio}
      MONITORING_SESSION_PATH: /app/session/monitoring_session
    command: [ "python", "start_all_monitoring.py" ]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - runtime_uploads:/app/static/uploads
      - runtime_logs:/app/logs
      - ./session:/app/session
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - runtime
    healthcheck:
      test: [ "CMD", "python", "-c", "print('ok')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    profiles:
      - monitoring

  camera_probe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soobshio_camera_probe
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soobshio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-soobshio}
    command: [ "python", "start_camera_probe.py" ]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - runtime_logs:/app/logs
    networks:
      - runtime
    healthcheck:
      test: [ "CMD", "python", "-c", "print('ok')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    profiles:
      - monitoring

  # ─── Viseron NVR (городское видеонаблюдение) ───
  viseron:
    image: roflcoopter/viseron:3.5.3
    container_name: soobshio_viseron
    restart: unless-stopped
    logging: *default-logging
    shm_size: "256mb"
    volumes:
      - ./ops/viseron/config:/config
      - viseron_data:/data
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - runtime
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    profiles:
      - monitoring

  nginx:
    image: nginx:1.27-alpine
    container_name: soobshio_nginx
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./ops/timeweb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - runtime_uploads:/var/www/soobshio/uploads:ro
      - ./public:/usr/share/nginx/html:ro
    networks:
      - runtime
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

  # ─── Ollama (локальный LLM/VLM сервер) ───
  ollama:
    image: ollama/ollama:0.5.7
    container_name: soobshio_ollama
    restart: unless-stopped
    init: true
    logging: *default-logging
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - runtime
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:11434" ]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    profiles:
      - ai

  # ─── LiteLLM (унифицированный AI-прокси) ───
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: soobshio_litellm
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - .env
    environment:
      OLLAMA_API_BASE: http://ollama:11434
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-unused}
      DATABASE_URL: postgresql://${POSTGRES_USER:-soobshio}:${POSTGRES_PASSWORD}@postgres:5432/litellm_proxy
      LITELLM_MIGRATION_DIR: /tmp/litellm_prisma
    volumes:
      - ./ops/litellm_config.yaml:/app/config.yaml:ro
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - runtime
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    profiles:
      - ai

volumes:
  postgres_data:
    name: soobshio_postgres_data
  redis_data:
    name: soobshio_redis_data
  runtime_uploads:
    name: soobshio_runtime_uploads
  runtime_logs:
    name: soobshio_runtime_logs
  ollama_models:
    name: soobshio_ollama_models
  viseron_data:
    name: soobshio_viseron_data

networks:
  runtime:
    name: soobshio_runtime
