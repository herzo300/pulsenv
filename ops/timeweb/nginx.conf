# HTTP — health probe + redirect to HTTPS
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Let's Encrypt (mount /etc/letsencrypt from host)
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 25M;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;

    ssl_certificate     /etc/letsencrypt/live/45-153-68-59.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/45-153-68-59.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/soobshio-locations.inc;
}
