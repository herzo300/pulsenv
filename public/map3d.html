<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITY PULSE 3D - Интерактивная 3D Карта Нижневартовска</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0b0f19; color: #fff; height: 100vh; overflow: hidden; }
        #header { position: absolute; top: 16px; left: 16px; z-index: 1000; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 14px 20px; border-radius: 12px; }
        h1 { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #map { width: 100vw; height: 100vh; background: #090d16; }
    </style>
</head>
<body>
    <div id="header">
        <h1>CITY PULSE 3D</h1>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Цифровой Двойник и 3D Карта Города</p>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([60.9388, 76.5562], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap, © CARTO'
        }).addTo(map);
    </script>
</body>
</html>
